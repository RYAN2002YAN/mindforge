<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MindForge — 晨风农场</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    overflow:hidden; background:#1a1a2e;
    font-family:'Georgia','Noto Serif SC',serif;
    user-select:none;
  }
  canvas { display:block; }

  /* 顶部状态 */
  #top-bar {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:28px; pointer-events:none;
    color:#e8d5bc; font-size:12px;
  }
  .st { text-align:center; opacity:0.8; }
  .st .v { font-size:20px; color:#ffcc66; text-shadow:0 0 8px rgba(255,200,100,.4); display:block; }

  /* 任务面板 (右侧) */
  #quest-panel {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    background:rgba(24,18,12,0.9); border:1px solid rgba(180,140,90,0.4);
    border-radius:10px; padding:16px 20px; color:#e0d0b8;
    min-width:180px; pointer-events:none;
    box-shadow:0 0 24px rgba(0,0,0,0.4);
  }
  #quest-panel h3 { font-size:11px; color:#b8956e; letter-spacing:2px; margin-bottom:8px; }
  #quest-panel .q { font-size:14px; line-height:1.6; }
  #quest-panel .q .highlight { color:#ffcc66; }

  /* 底部提示 */
  #hint {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    color:rgba(220,200,170,0.6); font-size:11px; pointer-events:none;
  }

  /* NPC 对话框 */
  #dialog {
    position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
    background:rgba(20,14,8,0.94); border:1px solid rgba(200,150,90,0.45);
    border-radius:12px; padding:18px 26px; color:#e8d5bc;
    max-width:400px; text-align:center; display:none;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    z-index:10;
  }
  #dialog .n { font-size:13px; color:#c9a050; margin-bottom:4px; }
  #dialog .l { font-size:15px; line-height:1.5; }
  #dialog .h { font-size:11px; color:rgba(200,180,150,0.45); margin-top:8px; }

  /* 完成弹窗 */
  #toast {
    position:absolute; top:30%; left:50%; transform:translate(-50%,-50%);
    font-size:22px; color:#ffdd88; pointer-events:none; opacity:0;
    text-shadow:0 0 20px rgba(255,200,100,0.8);
    transition:opacity 0.3s;
  }
</style>
</head>
<body>

<div id="top-bar">
  <div class="st"><span class="v" id="st-cleared">0</span>已开垦</div>
  <div class="st"><span class="v" id="st-total">64</span>总地块</div>
  <div class="st"><span class="v" id="st-streak">🔥 0</span>连续行动</div>
</div>

<div id="quest-panel">
  <h3>📋 当前任务</h3>
  <div class="q" id="quest-text">走向守夜人<br>点击他接取任务</div>
</div>

<div id="toast"></div>

<div id="hint">⌨ WASD 移动 &nbsp;|&nbsp; 🖱 点击 NPC 接任务 &nbsp;|&nbsp; 🖱 点击高亮地块快速前往</div>

<div id="dialog">
  <div class="n" id="dlg-name"></div>
  <div class="l" id="dlg-line"></div>
  <div class="h" id="dlg-hint"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ══════════════════════════════ DOM ══════════════════════════════
const $stCleared = document.getElementById('st-cleared');
const $stStreak  = document.getElementById('st-streak');
const $questText = document.getElementById('quest-text');
const $toast     = document.getElementById('toast');
const $dialog    = document.getElementById('dialog');
const $dlgName   = document.getElementById('dlg-name');
const $dlgLine   = document.getElementById('dlg-line');
const $dlgHint   = document.getElementById('dlg-hint');
const $hint      = document.getElementById('hint');

// ══════════════════════════════ SCENE ══════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);  // 天空蓝
scene.fog = new THREE.Fog(0xc8e0f0, 20, 50);

const SIZE = 14;  // 可视区域半宽
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 80);
camera.position.set(0, 18, 13);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;  // 无阴影 → 大幅提升性能
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ══════════════════════════════ LIGHTING (极简) ═══════════════════
scene.add(new THREE.HemisphereLight(0xffeedd, 0x779955, 1.3));
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xfff5e8, 2.5);
sun.position.set(5, 15, 8);
scene.add(sun);

// ══════════════════════════════ GROUND ════════════════════════════
// 主地面 (草地)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshLambertMaterial({ color: 0x7ec850 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
ground.name = 'ground';
scene.add(ground);

// 农场区域 (颜色略深)
const farmBg = new THREE.Mesh(
  new THREE.PlaneGeometry(15, 15),
  new THREE.MeshLambertMaterial({ color: 0x8bc460 })
);
farmBg.rotation.x = -Math.PI/2;
farmBg.position.y = 0.01;
scene.add(farmBg);

// 栅栏
function addFence(x, z, rotY, len) {
  const rail = new THREE.Mesh(
    new THREE.BoxGeometry(len, 0.08, 0.06),
    new THREE.MeshLambertMaterial({ color: 0xc4946e })
  );
  rail.position.set(x, 0.3, z);
  rail.rotation.y = rotY;
  scene.add(rail);
  // 柱子
  const posts = Math.floor(len / 0.7);
  for (let i = 0; i <= posts; i++) {
    const t = (i / posts - 0.5) * len;
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.05, 0.45, 5),
      new THREE.MeshLambertMaterial({ color: 0x8b6b4a })
    );
    post.position.set(
      x + (rotY === 0 ? t : 0),
      0.22,
      z + (rotY !== 0 ? t : 0)
    );
    scene.add(post);
  }
}
addFence(0, -7.3, 0, 15);
addFence(0,  7.3, 0, 15);
addFence(-7.3, 0, Math.PI/2, 15);
addFence( 7.3, 0, Math.PI/2, 15);

// ══════════════════════════════ FARMHOUSE ══════════════════════════
const house = new THREE.Group();
house.add(new THREE.Mesh(
  new THREE.BoxGeometry(1.8, 1.6, 1.4),
  new THREE.MeshLambertMaterial({ color: 0xf5ecd7 })
)).position.y = 0.8;
house.add(new THREE.Mesh(
  new THREE.ConeGeometry(1.3, 0.9, 4).rotateY(Math.PI/4),
  new THREE.MeshLambertMaterial({ color: 0xc44a30 })
)).position.y = 2.05;
// 门
house.add(new THREE.Mesh(
  new THREE.BoxGeometry(0.3, 0.55, 0.05),
  new THREE.MeshLambertMaterial({ color: 0x5c3a1e })
)).position.set(0, 0.28, 0.73);
house.position.set(0, 0, -5.6);
scene.add(house);

// ══════════════════════════════ TILE GRID ══════════════════════════
const GRID = 8;
const TILE_SIZE = 0.7;
const GAP = 0.08;
const STEP = TILE_SIZE + GAP;
const OFFSET = (GRID - 1) * STEP / 2;

const tiles = [];             // { mesh, cleared, row, col }
const tileGroup = new THREE.Group();
const darkMat  = new THREE.MeshLambertMaterial({ color: 0x5c4028 });   // 未开垦: 棕色
const clearMat = new THREE.MeshLambertMaterial({ color: 0x8b9a3e });   // 已开垦: 翠绿

for (let r = 0; r < GRID; r++) {
  for (let c = 0; c < GRID; c++) {
    const tile = new THREE.Mesh(
      new THREE.BoxGeometry(TILE_SIZE, 0.04, TILE_SIZE),
      darkMat.clone()
    );
    tile.position.set(c * STEP - OFFSET, 0.03, r * STEP - OFFSET);
    tile.receiveShadow = true;
    tileGroup.add(tile);

    // 小十字标记 (未开垦地块上的杂草符号)
    const mark = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.06, 0.04),
      new THREE.MeshLambertMaterial({ color: 0x6b5030 })
    );
    mark.position.set(c * STEP - OFFSET, 0.07, r * STEP - OFFSET);
    tileGroup.add(mark);

    tiles.push({ mesh: tile, mark, cleared: false, row: r, col: c });
  }
}
scene.add(tileGroup);

// ══════════════════════════════ TARGET RING ═══════════════════════
const targetRing = new THREE.Mesh(
  new THREE.TorusGeometry(TILE_SIZE/2 + 0.05, 0.06, 8, 16),
  new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.8, depthTest: false })
);
targetRing.rotation.x = -Math.PI/2;
targetRing.visible = false;
scene.add(targetRing);

// ══════════════════════════════ PLAYER ════════════════════════════
const player = new THREE.Group();
player.add(new THREE.Mesh(
  new THREE.CapsuleGeometry(0.18, 0.3, 4, 8),
  new THREE.MeshLambertMaterial({ color: 0x4488cc })
)).position.y = 0.45;
player.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 8, 6),
  new THREE.MeshLambertMaterial({ color: 0xffdbb4 })
)).position.y = 0.95;
// 草帽
player.add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.16, 0.24, 0.08, 8),
  new THREE.MeshLambertMaterial({ color: 0xe8d5a0 })
)).position.y = 1.1;
player.add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.18, 0.1, 8),
  new THREE.MeshLambertMaterial({ color: 0xe8d5a0 })
)).position.y = 1.18;
player.position.set(0, 0, -4);
scene.add(player);

// 玩家影子 (圆盘)
const playerShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.2, 8),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthTest: false })
);
playerShadow.rotation.x = -Math.PI/2;
playerShadow.position.y = 0.015;
player.add(playerShadow);

// ══════════════════════════════ NPC ════════════════════════════════
const npc = new THREE.Group();
npc.add(new THREE.Mesh(
  new THREE.CapsuleGeometry(0.2, 0.4, 4, 8),
  new THREE.MeshLambertMaterial({ color: 0x885540 })
)).position.y = 0.5;
npc.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.19, 8, 6),
  new THREE.MeshLambertMaterial({ color: 0xd4b896 })
)).position.y = 1.05;
// 白发
npc.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.2, 8, 6),
  new THREE.MeshLambertMaterial({ color: 0xe8e0d0 })
)).position.y = 1.06;
// 斗篷
npc.add(new THREE.Mesh(
  new THREE.ConeGeometry(0.3, 0.4, 6),
  new THREE.MeshLambertMaterial({ color: 0x6b4040 })
)).position.y = 0.35;

// NPC头顶感叹号
const exclGroup = new THREE.Group();
exclGroup.add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.04, 0.04, 0.25, 6),
  new THREE.MeshBasicMaterial({ color: 0xff4444 })
)).position.y = 1.5;
exclGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.08, 6, 4),
  new THREE.MeshBasicMaterial({ color: 0xff4444 })
)).position.y = 1.7;
npc.add(exclGroup);

npc.position.set(1.5, 0, -4.8);
scene.add(npc);

// ══════════════════════════════ SPARKLE POOL ═══════════════════════
const sparkles = [];
const sparkGeo = new THREE.SphereGeometry(0.04, 4, 3);
function burstSparkles(x, y, z, count = 30) {
  for (let i = 0; i < count; i++) {
    const s = new THREE.Mesh(
      sparkGeo,
      new THREE.MeshBasicMaterial({ color: 0xffdd66, transparent: true, opacity: 1 })
    );
    s.position.set(x, y, z);
    s.userData = {
      vx: (Math.random()-0.5)*3,
      vy: 1 + Math.random()*4,
      vz: (Math.random()-0.5)*3,
      life: 0.6 + Math.random()*0.8,
    };
    scene.add(s);
    sparkles.push(s);
  }
}

// ══════════════════════════════ GAME STATE ════════════════════════
let clearedCount = 0;
let currentTarget = null;   // { row, col }
let streakCount = 0;
let playerTarget = null;    // click-to-move
const keys = {};

const questMessages = [
  '开垦你脚下这片土地——走向那块发光的地块，它就会恢复生机。',
  '好极了！看到那块还在发光的地了吗？继续开垦吧。',
  '一锄一锄来。每块地变绿，溪谷就多一分生机。',
  '你做得很好。继续吧，我在树荫下看着。',
  '那片棕色的荒地——走上去，它就属于你了。',
  '你知道吗？古代的农人相信，土地记得每一个踩过它的人。',
];

// ══════════════════════════════ HELPERS ═══════════════════════════
function getTileWorldPos(row, col) {
  return new THREE.Vector3(col * STEP - OFFSET, 0.05, row * STEP - OFFSET);
}

function clearTile(tileData) {
  if (tileData.cleared) return;
  tileData.cleared = true;
  tileData.mesh.material = clearMat.clone();
  if (tileData.mark) {
    tileData.mark.material.opacity = 0;
    tileData.mark.scale.set(0,0,0);
  }
  clearedCount++;
  $stCleared.textContent = clearedCount;

  const pos = getTileWorldPos(tileData.row, tileData.col);
  burstSparkles(pos.x, pos.y + 0.2, pos.z, 25);

  // 完成率过半 → 栅栏外出现小路 (简化: 只更新颜色)
  if (clearedCount === Math.floor(GRID*GRID/2)) {
    showToast('🌟 过半了！农场正在苏醒...');
  }
  if (clearedCount === GRID*GRID) {
    showToast('🏆 全部开垦完毕！你是溪谷的守护者。');
  }

  currentTarget = null;
  targetRing.visible = false;
  assignNewTask();
}

function assignNewTask() {
  // 找一个未开垦的地块
  const uncleared = tiles.filter(t => !t.cleared);
  if (uncleared.length === 0) {
    $questText.innerHTML = '<span style="color:#ffdd88;">✨ 全部完成！</span><br>农场已完全复苏。';
    $dlgLine.textContent = '「不可思议……整片农场都活过来了。你是真正的溪谷守护者。」';
    return;
  }
  const pick = uncleared[Math.floor(Math.random() * uncleared.length)];
  currentTarget = { row: pick.row, col: pick.col };
  const pos = getTileWorldPos(pick.row, pick.col);
  targetRing.position.copy(pos);
  targetRing.visible = true;
  const colLabel = String.fromCharCode(65 + pick.col);
  $questText.innerHTML = `开垦地块 <span class="highlight">${colLabel}${pick.row+1}</span><br>走过去，它就会变绿`;
}

function showToast(msg) {
  $toast.textContent = msg;
  $toast.style.opacity = '1';
  setTimeout(() => { $toast.style.opacity = '0'; }, 2000);
}

// ══════════════════════════════ NPC DIALOGUE ═══════════════════════
let questIndex = 0;
function talkToNPC() {
  $dlgName.textContent = '守夜人 · 艾尔文';
  $dlgLine.textContent = questMessages[questIndex % questMessages.length];
  $dlgHint.textContent = '按 Enter 接取任务 · 按 Esc 离开';
  $dialog.style.display = 'block';
  questIndex++;
}

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key === 'Escape') { $dialog.style.display = 'none'; return; }
  if ($dialog.style.display !== 'block') return;

  if (e.key === 'Enter') {
    $dialog.style.display = 'none';
    if (!currentTarget) assignNewTask();
    streakCount++;
    $stStreak.textContent = '🔥 ' + streakCount;
  }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ══════════════════════════════ CLICK ══════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', e => {
  mouse.x = (e.clientX/innerWidth)*2 - 1;
  mouse.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // NPC?
  const npcHits = raycaster.intersectObjects(npc.children, true);
  if (npcHits.length) { talkToNPC(); return; }

  // Target tile ring?
  if (targetRing.visible) {
    const ringHits = raycaster.intersectObject(targetRing);
    if (ringHits.length && currentTarget) {
      playerTarget = getTileWorldPos(currentTarget.row, currentTarget.col);
      return;
    }
  }

  // Ground (move to point)
  const gh = raycaster.intersectObject(ground);
  if (gh.length) {
    playerTarget = gh[0].point.clone();
    playerTarget.y = 0;
  }
});

// ══════════════════════════════ UPDATE ══════════════════════════════
const _v3 = new THREE.Vector3();
function updatePlayer(dt) {
  const speed = 4.5;
  const pos = player.position;

  // click-to-move 优先
  if (playerTarget) {
    const to = _v3.copy(playerTarget).sub(pos);
    to.y = 0;
    const dist = to.length();
    if (dist < 0.25) {
      playerTarget = null;
      // 检查是否走到了目标地块
      if (currentTarget) {
        const tp = getTileWorldPos(currentTarget.row, currentTarget.col);
        if (Math.abs(pos.x - tp.x) < STEP*0.6 && Math.abs(pos.z - tp.z) < STEP*0.6) {
          const tile = tiles.find(t => t.row === currentTarget.row && t.col === currentTarget.col);
          if (tile) clearTile(tile);
        }
      }
    } else {
      const dir = to.normalize();
      pos.x += dir.x * speed * dt;
      pos.z += dir.z * speed * dt;
      // face direction
      const a = Math.atan2(dir.x, dir.z);
      player.rotation.y += (a - player.rotation.y) * 0.2;
    }
  }

  // WASD
  if (!playerTarget) {
    let mx = 0, mz = 0;
    if (keys['w'] || keys['arrowup'])    mz -= 1;
    if (keys['s'] || keys['arrowdown'])  mz += 1;
    if (keys['a'] || keys['arrowleft'])  mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;

    if (mx !== 0 || mz !== 0) {
      const len = Math.sqrt(mx*mx + mz*mz);
      pos.x += (mx/len) * speed * dt;
      pos.z += (mz/len) * speed * dt;
      const a = Math.atan2(mx, -mz);
      player.rotation.y += (a - player.rotation.y) * 0.2;
    }

    // 碰到高亮地块自动清除
    if (currentTarget && !playerTarget) {
      const tp = getTileWorldPos(currentTarget.row, currentTarget.col);
      if (Math.abs(pos.x - tp.x) < STEP*0.55 && Math.abs(pos.z - tp.z) < STEP*0.55) {
        const tile = tiles.find(t => t.row === currentTarget.row && t.col === currentTarget.col);
        if (tile) clearTile(tile);
      }
    }
  }

  // 边界限制 (栅栏内)
  pos.x = Math.max(-6.5, Math.min(6.5, pos.x));
  pos.z = Math.max(-6.5, Math.min(6.5, pos.z));

  // 微小浮动
  player.position.y = Math.sin(Date.now()*0.004)*0.03;
}

// ══════════════════════════════ ANIMATION ═══════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.1);

  updatePlayer(dt);

  // NPC 浮动
  npc.position.y = Math.sin(t*1.5)*0.08;
  exclGroup.rotation.y += 0.02;
  exclGroup.position.y = Math.sin(t*3)*0.04;

  // 目标环旋转 + 呼吸
  if (targetRing.visible) {
    targetRing.rotation.z += 0.015;
    const s = 1 + Math.sin(t*3)*0.08;
    targetRing.scale.setScalar(s);
    targetRing.material.opacity = 0.5 + Math.sin(t*3)*0.3;
  }

  // 火花粒子衰减
  for (let i = sparkles.length-1; i >= 0; i--) {
    const s = sparkles[i];
    s.userData.life -= dt;
    if (s.userData.life <= 0) {
      scene.remove(s);
      sparkles.splice(i,1);
      continue;
    }
    s.position.x += s.userData.vx * dt;
    s.position.y += s.userData.vy * dt;
    s.position.z += s.userData.vz * dt;
    s.userData.vy += dt * 2; // 微重力
    s.material.opacity = Math.max(0, s.userData.life);
  }

  // HUD
  $hint.innerHTML = playerTarget
    ? '🏃 前往目标地块...'
    : '⌨ WASD 移动 &nbsp;|&nbsp; 🖱 点击 NPC 接任务 &nbsp;|&nbsp; 🖱 点击发光环快速前往';

  renderer.render(scene, camera);
}

// ══════════════════════════════ RESIZE ═════════════════════════════
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ══════════════════════════════ START ══════════════════════════════
// 初始已经开垦小屋周围4块地
[[3,3],[3,4],[4,3],[4,4]].forEach(([r,c]) => {
  const td = tiles.find(t => t.row===r && t.col===c);
  if (td) { td.cleared = true; td.mesh.material = clearMat.clone(); if (td.mark) { td.mark.scale.set(0,0,0); } }
});
clearedCount = 4;
$stCleared.textContent = clearedCount;
