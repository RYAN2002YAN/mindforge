<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MindForge — 溪谷 · The Vale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #3a3040;
      font-family: 'Georgia', 'Noto Serif SC', serif;
      cursor: grab;
    }
    body:active { cursor: grabbing; }

    #hud {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      text-align: center; pointer-events: none; user-select: none;
    }
    #hud-title {
      font-size: 26px; color: #f5e6d3;
      text-shadow: 0 0 20px rgba(255,200,140,0.5), 0 2px 4px rgba(0,0,0,0.4);
      letter-spacing: 4px;
    }
    #hud-hint {
      font-size: 12px; color: rgba(220,200,170,0.65); margin-top: 5px;
    }

    #top-bar {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 22px; pointer-events: none; user-select: none;
    }
    .stat-item { text-align: center; color: #e8d5bc; font-size: 11px; opacity: 0.7; }
    .stat-value { font-size: 17px; color: #f0c060; text-shadow: 0 0 8px rgba(240,192,96,0.4); }

    #dialog {
      position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
      background: rgba(28,20,16,0.93); border: 1px solid rgba(200,160,100,0.35);
      border-radius: 12px; padding: 18px 26px; color: #e8d5bc;
      max-width: 400px; text-align: center; display: none;
      backdrop-filter: blur(8px); box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    #dialog .npc-name { font-size: 13px; color: #c9a050; margin-bottom: 5px; }
    #dialog .npc-line { font-size: 15px; line-height: 1.55; }
    #dialog .npc-hint  { font-size: 11px; color: rgba(200,180,150,0.45); margin-top: 8px; }

    /* 山顶进度条 */
    #mountain-progress {
      position: absolute; top: 70px; right: 20px;
      pointer-events: none; user-select: none;
      color: #e8d5bc; font-size: 11px; text-align: right; opacity: 0.75;
    }
    #mt-bar-bg {
      width: 100px; height: 4px; background: rgba(255,255,255,0.15);
      border-radius: 2px; margin-top: 3px; margin-left: auto;
    }
    #mt-bar-fill {
      width: 8%; height: 100%; background: #f0c060;
      border-radius: 2px; transition: width 0.5s ease;
    }

    @media (max-width: 640px) {
      #hud-title { font-size: 18px; }
      #dialog { max-width: 88vw; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="stat-item"><div class="stat-value" id="stat-tasks">5</div>待解任务</div>
    <div class="stat-item"><div class="stat-value" id="stat-day">1</div>今日完成</div>
    <div class="stat-item"><div class="stat-value" id="stat-streak">🔥 3</div>连续天数</div>
  </div>

  <div id="mountain-progress">
    登顶进度
    <div id="mt-bar-bg"><div id="mt-bar-fill"></div></div>
  </div>

  <div id="hud">
    <div id="hud-title">🏮 溪 谷 之 地</div>
    <div id="hud-hint">⌨ WASD 移动 &nbsp;|&nbsp; 🖱 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放 &nbsp;|&nbsp; 点击地面移动 &nbsp;|&nbsp; 点击 NPC 对话</div>
  </div>

  <div id="dialog">
    <div class="npc-name" id="dlg-name"></div>
    <div class="npc-line" id="dlg-line"></div>
    <div class="npc-hint"  id="dlg-hint"></div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
